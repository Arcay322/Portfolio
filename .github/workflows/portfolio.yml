name: Verify portfolio
on:
  pull_request:
    paths: ['portfolio/**', 'public/images/**', 'scripts/*portfolio.mjs', 'scripts/verify-hosting.mjs', 'tests/portfolio/**', 'package*.json', 'firebase.json', '.firebaserc', '.github/workflows/portfolio.yml']
  push:
    branches: [main, master]
    paths: ['portfolio/**', 'public/images/**', 'scripts/*portfolio.mjs', 'scripts/verify-hosting.mjs', 'tests/portfolio/**', 'package*.json', 'firebase.json', '.firebaserc', '.github/workflows/portfolio.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run verify:portfolio
      - run: npm run test:hosting
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-firebase
          path: dist/
          retention-days: 7
